# Regenerate the Lean explorer's data from Alpöge's release and deploy it to
# GitHub Pages. The release is streamed (HTTP -> gzip -> tar, in memory) and
# never stored: only the compact JSON shards under explorer/data/ are written.
# The generator refuses to write anything if the concatenation's SHA-256 is not
# the one recorded in COMPARISON.md §7. See README.md, "The explorer".
name: Explorer (Pages)

on:
  push:
    branches: [main]
    paths:
      - "explorer/**"
      - "tools/explorer/**"
      - ".github/workflows/explorer.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Unit tests of the parser
        run: go -C tools/explorer test .
      - name: Stream the release and write the data
        shell: bash # -eo pipefail: a generator failure fails the job
        run: go -C tools/explorer run . -out ../../explorer/data 2>&1 | tee generator.log
      # The readable edition of lsernau/grh-lean, pinned by commit (SESSION 447).
      # Fetching a SHA checks it out exactly; nothing in the clone is run, it is
      # only read by the generator, which also writes the compartment map c.json.
      - name: The readable edition of lsernau/grh-lean, with its compartment map
        shell: bash
        run: |
          set -eo pipefail
          GRH_COMMIT=72fead102f663d5c7a407964a13dc0cf9d977207
          git init -q "$RUNNER_TEMP/grh-lean"
          git -C "$RUNNER_TEMP/grh-lean" fetch -q --depth 1 https://github.com/lsernau/grh-lean "$GRH_COMMIT"
          git -C "$RUNNER_TEMP/grh-lean" checkout -q FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/grh-lean" rev-parse HEAD)" = "$GRH_COMMIT"
          go -C tools/explorer run . -dot 1 -src "$RUNNER_TEMP/grh-lean/grh" -commit "$GRH_COMMIT" \
            -repo "https://github.com/lsernau/grh-lean/tree/$GRH_COMMIT/grh" \
            -edition "lsernau/grh-lean, readable edition (grh/)" \
            -compartments compartments/grh.json -out ../../explorer/data/grh 2>&1 | tee generator-grh.log
      - name: Data size
        run: du -sh explorer/data explorer/data/*
      - uses: actions/upload-pages-artifact@v3
        with:
          path: explorer

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
